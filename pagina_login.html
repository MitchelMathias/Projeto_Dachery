<html><head>
  <title>Entrar em Atacado</title>

  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">



      <link href="/auth/resources/23zsc/login/portal-atacado/dist/index.css" rel="stylesheet">

      <script defer="" src="/auth/resources/23zsc/login/portal-atacado/dist/index.js" type="text/javascript"></script>
    </head>
    <body>
  <div class="background-container-atacado flex flex-col items-center justify-center min-h-screen sm:py-16">
    <div class="max-w-md space-y-6 w-full">
  <div class="background-card-atacado p-8 rounded-lg space-y-6">
  <header class="space-y-4">
  <div class="flex justify-center">
    <img class="logo-portal-atacado-image-svg" alt="Portal Atacado logo">
  </div>
  <h1 class="texto-login-portal-atacado">    </h1><h1 class="texto-login-portal-atacado py-2">Bem-vindo, por favor, digite seu Login e Senha para realizar o login no portal</h1>

  </header>
  <main class="space-y-4">
      <form action="https://auth.conectcar.com/auth/realms/Atacado/login-actions/authenticate?session_code=JQfe_rGokSMgiJm2lX8oaLU8Lr2WgQ7iXzbs0L6_rZ4&amp;execution=631832fe-2c11-4b97-a030-779ef3c494a9&amp;client_id=portal-atacado-web&amp;tab_id=OZxeKxRrui0" class="m-0 space-y-4" method="post" onsubmit="login.disabled = true; return true;">
        <input name="credentialId" type="hidden" value="">
        <div>
          <h1>Usuário</h1>
  <label class="sr-only" for="username">
Endereço de e-mail  </label>
  <input autofocus="" required="" aria-invalid="false" class="block bord-primary-atacado mt-1 w-full focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 sm:text-sm" id="username" name="username" placeholder="Endereço de e-mail" autocomplete="email" type="text" value="">
        </div>
        <div>
          <h1>Senha</h1>
  <label class="sr-only" for="password">
            Digite sua senha
  </label>
  <input required="" aria-invalid="false" class="block bord-primary-atacado mt-1 w-full focus:border-primary-300 focus:ring focus:ring-primary-200 focus:ring-opacity-50 sm:text-sm" id="password" name="password" placeholder="Digite sua senha" type="password">
        </div>
        <div class="flex items-center justify-between">
        </div>
        <div class="pt-4">
  <button class="bg-primary-600 flex justify-center px-4 py-2 relative rounded-lg text-sm text-white w-full focus:outline-none focus:ring-2 focus:ring-primary-600 focus:ring-offset-2 hover:bg-primary-700" name="login" type="submit">
            Entrar
  </button>
        </div>
        <div class="pt-4 text-center">
  <a class="text-primary-600 hover:text-primary-500" href="/auth/realms/Atacado/login-actions/reset-credentials?client_id=portal-atacado-web&amp;tab_id=OZxeKxRrui0">
              <span class="texto-primary-link-atacado">Esqueceu sua senha?</span>
  </a>
        </div>
      </form>
  </main>
  </div>
  <div class="flex justify-around">
  </div>
    </div>
  </div>
    
  
</body></html>
